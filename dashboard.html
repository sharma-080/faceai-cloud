<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>FaceAI Live</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        :root {
            --bg: #09090f;
            --surface: #0f0f1a;
            --card: #13131f;
            --border: #1e1e2e;
            --accent: #00e5ff;
            --ok: #00ff88;
            --warn: #ff3b5c;
            --text: #e8e8f4;
            --muted: #4a4a6a;
            --sub: #7070a0;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'DM Sans', system-ui, sans-serif;
            min-height: 100vh;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 24px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
        }

        .logo {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--accent);
        }

        .status-pill {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            border-radius: 20px;
            background: var(--card);
            border: 1px solid var(--border);
            font-size: 13px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--muted);
            transition: background .4s;
        }

        .dot.online {
            background: var(--ok);
            box-shadow: 0 0 8px var(--ok);
        }

        .dot.offline {
            background: var(--warn);
        }

        .layout {
            display: grid;
            grid-template-columns: 1fr 360px;
            gap: 20px;
            padding: 20px 24px;
            max-width: 1400px;
            margin: 0 auto;
        }

        @media (max-width: 900px) {
            .layout {
                grid-template-columns: 1fr;
            }
        }

        /* Feed */
        .feed-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
        }

        .feed-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: .8px;
            color: var(--sub);
        }

        #feed-img {
            width: 100%;
            display: block;
            aspect-ratio: 16/9;
            object-fit: cover;
            background: #000;
        }

        .feed-footer {
            padding: 8px 16px;
            font-size: 12px;
            color: var(--sub);
        }

        /* Sidebar */
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
        }

        .card-title {
            padding: 12px 16px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: .8px;
            color: var(--sub);
            border-bottom: 1px solid var(--border);
        }

        /* Stats */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1px;
            background: var(--border);
        }

        .stat {
            background: var(--card);
            padding: 16px;
            text-align: center;
        }

        .stat-val {
            font-size: 28px;
            font-weight: 700;
            color: var(--accent);
        }

        .stat-lbl {
            font-size: 11px;
            color: var(--sub);
            margin-top: 4px;
            text-transform: uppercase;
        }

        /* Unknown gallery */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            padding: 12px;
        }

        .gallery-item img {
            width: 100%;
            border-radius: 6px;
            aspect-ratio: 1/1;
            object-fit: cover;
            border: 2px solid var(--warn);
        }

        .gallery-item .ts {
            font-size: 10px;
            color: var(--sub);
            text-align: center;
            margin-top: 4px;
        }

        /* Events */
        .event-list {
            max-height: 320px;
            overflow-y: auto;
        }

        .event-list::-webkit-scrollbar {
            width: 4px;
        }

        .event-list::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 2px;
        }

        .event-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 16px;
            border-bottom: 1px solid var(--border);
        }

        .event-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .event-name {
            font-weight: 600;
            font-size: 13px;
            flex: 1;
        }

        .badge {
            font-size: 10px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 20px;
            text-transform: uppercase;
        }

        .badge.entry {
            background: rgba(0, 255, 136, .15);
            color: var(--ok);
        }

        .badge.unknown {
            background: rgba(255, 59, 92, .15);
            color: var(--warn);
        }

        .event-time {
            font-size: 11px;
            color: var(--sub);
            margin-top: 2px;
        }

        .empty {
            padding: 24px;
            text-align: center;
            color: var(--muted);
            font-size: 13px;
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">⬡ FaceAI Live</div>
        <div class="status-pill">
            <div class="dot" id="dot"></div>
            <span id="status-text">Connecting…</span>
        </div>
    </header>

    <div class="layout">

        <!-- Live feed -->
        <div>
            <div class="feed-card">
                <div class="feed-header">
                    <span>Live Camera</span>
                    <span id="age-badge" style="color:var(--accent);font-size:12px"></span>
                </div>
                <img id="feed-img" alt="Waiting for feed…" />
                <div class="feed-footer" id="feed-footer">Waiting for first frame…</div>
            </div>
        </div>

        <!-- Sidebar -->
        <div class="sidebar">

            <!-- Stats -->
            <div class="card">
                <div class="card-title">Today's Activity</div>
                <div class="stats-grid">
                    <div class="stat">
                        <div class="stat-val" id="stat-entries">—</div>
                        <div class="stat-lbl">Known Entries</div>
                    </div>
                    <div class="stat">
                        <div class="stat-val" id="stat-unknowns">—</div>
                        <div class="stat-lbl">Unknowns</div>
                    </div>
                </div>
            </div>

            <!-- Unknown faces gallery -->
            <div class="card">
                <div class="card-title">⚠ Recent Unknown Faces</div>
                <div class="gallery-grid" id="unknown-gallery">
                    <div class="empty" style="grid-column:1/-1">No unknowns captured yet</div>
                </div>
            </div>

            <!-- Event log -->
            <div class="card">
                <div class="card-title">Event Log</div>
                <div class="event-list" id="event-list">
                    <div class="empty">No events yet</div>
                </div>
            </div>

        </div>
    </div>

    <script>
        const dot = document.getElementById('dot');
        const statusText = document.getElementById('status-text');
        const feedImg = document.getElementById('feed-img');
        const feedFooter = document.getElementById('feed-footer');
        const ageBadge = document.getElementById('age-badge');
        const eventList = document.getElementById('event-list');
        const unknownGallery = document.getElementById('unknown-gallery');
        const statEntries = document.getElementById('stat-entries');
        const statUnknowns = document.getElementById('stat-unknowns');

        async function refreshFrame() {
            try {
                const data = await fetch('/api/latest-frame').then(r => r.json());
                if (data.frame) {
                    feedImg.src = 'data:image/jpeg;base64,' + data.frame;
                    const age = data.age;
                    ageBadge.textContent = age < 3 ? '● LIVE' : `${age}s ago`;
                    ageBadge.style.color = age < 3 ? 'var(--ok)' : 'var(--warn)';
                    feedFooter.textContent = `Last frame: ${new Date().toLocaleTimeString()}`;
                }
            } catch (e) { }
        }

        async function refreshStatus() {
            try {
                const data = await fetch('/api/status').then(r => r.json());
                dot.className = 'dot ' + (data.online ? 'online' : 'offline');
                statusText.textContent = data.online ? 'Camera Online' : 'Camera Offline';
            } catch (e) {
                dot.className = 'dot offline';
                statusText.textContent = 'Disconnected';
            }
        }

        async function refreshEvents() {
            try {
                const events = await fetch('/api/events?limit=50').then(r => r.json());
                if (!events.length) return;

                // Stats
                const today = new Date().toDateString();
                let entries = 0, unknowns = 0;
                events.forEach(e => {
                    const d = new Date(e.time.slice(0, 23));
                    if (d.toDateString() === today) {
                        if (e.event === 'ENTRY') entries++;
                        if (e.event === 'UNKNOWN') unknowns++;
                    }
                });
                statEntries.textContent = entries;
                statUnknowns.textContent = unknowns;

                // Unknown gallery — only events with image_url
                const unknownImgs = events.filter(e => e.event === 'UNKNOWN' && e.image_url);
                if (unknownImgs.length) {
                    unknownGallery.innerHTML = unknownImgs.slice(0, 9).map(e => {
                        const t = new Date(e.time.slice(0, 23));
                        const ts = isNaN(t) ? '' : t.toLocaleTimeString();
                        return `<div class="gallery-item">
          <img src="${e.image_url}" loading="lazy" onerror="this.style.display='none'"/>
          <div class="ts">${ts}</div>
        </div>`;
                    }).join('');
                }

                // Event log
                eventList.innerHTML = events.slice(0, 30).map(e => {
                    const isUnknown = e.name === 'Unknown';
                    const color = isUnknown ? 'var(--warn)' : 'var(--ok)';
                    const badge = isUnknown ? 'unknown' : 'entry';
                    const timeStr = new Date(e.time.slice(0, 23)).toLocaleTimeString();
                    const conf = e.confidence ? ` · ${Math.round(e.confidence)}%` : '';
                    return `<div class="event-row">
        <div class="event-dot" style="background:${color}"></div>
        <div class="event-name">${e.name}</div>
        <div>
          <div class="badge ${badge}">${e.event}${conf}</div>
          <div class="event-time">${timeStr}</div>
        </div>
      </div>`;
                }).join('');

            } catch (e) { }
        }

        refreshFrame();
        refreshStatus();
        refreshEvents();
        setInterval(refreshFrame, 800);
        setInterval(refreshStatus, 3000);
        setInterval(refreshEvents, 3000);
    </script>
</body>

</html>
